apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-config
  namespace: pg-ha
data:
  patroni.yml: |
    scope: pg-ha-cluster
    name: $(POD_NAME)
    kubernetes:
      namespace: pg-ha
      labels:
        app: postgres
        cluster-name: pg-ha-cluster
      role_label: role
      leader_label_value: master
      follower_label_value: replica
    restapi:
      listen: 0.0.0.0:8008
      connect_address: $(POD_IP):8008
    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        synchronous_mode: true
        synchronous_mode_strict: false
        postgresql:
          use_pg_rewind: true
          parameters:
            max_connections: 100
            shared_buffers: 128MB
            wal_level: replica
            hot_standby: "on"
            wal_keep_size: 128MB
            max_wal_senders: 10
            max_replication_slots: 10
            wal_log_hints: "on"
          pg_hba:
            - local all all trust
            - host all all 127.0.0.1/32 md5
            - host all all 0.0.0.0/0 md5
            - host replication replicator 0.0.0.0/0 md5
    postgresql:
      listen: 0.0.0.0:5432
      connect_address: $(POD_IP):5432
      data_dir: /home/postgres/data/pgdata
      pgpass: /tmp/pgpass
      authentication:
        superuser:
          username: postgres
          password: $(SUPERUSER_PASSWORD)
        replication:
          username: replicator
          password: $(REPLICATION_PASSWORD)
      parameters:
        unix_socket_directories: /tmp
    tags:
      nofailover: false
      noloadbalance: false
      clonefrom: false
      nosync: false
